name: ic

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pedidos:
    build:
      context: .
      dockerfile: src/IC.Pedidos/Dockerfile
    environment:
      ConnectionStrings__PedidosDb: "Server=sqlserver,1433;Database=PedidosDB;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy

  pagamentos:
    build:
      context: .
      dockerfile: src/IC.Pagamentos/Dockerfile
    environment:
      ConnectionStrings__PagamentosDb: "Server=sqlserver,1433;Database=PagamentosDB;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      Pagamento__LimiteAprovacao: "500"
    ports:
      - "5002:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy

  cozinha:
    build:
      context: .
      dockerfile: src/IC.Cozinha/Dockerfile
    environment:
      ConnectionStrings__CozinhaDb: "Server=sqlserver,1433;Database=CozinhaDB;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      Cozinha__TempoPreparoSegundos: "5"
    ports:
      - "5003:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  sqlserver-data:
